<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">FlashTune neon anime street racing hero</title>
<desc id="desc">Стилизованная взрослая аниме-девушка рядом с синим спортивным автомобилем на фоне неонового города.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081228"/><stop offset=".55" stop-color="#171033"/><stop offset="1" stop-color="#120711"/></linearGradient>
  <linearGradient id="car" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2759b6"/><stop offset=".45" stop-color="#153a7b"/><stop offset="1" stop-color="#071227"/></linearGradient>
  <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#25293c"/><stop offset=".6" stop-color="#0c0f18"/><stop offset="1" stop-color="#271124"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1020"/><stop offset=".52" stop-color="#3b245e"/><stop offset="1" stop-color="#e52c86"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
